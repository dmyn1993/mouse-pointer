name: Build APK and publish Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
            echo "Release keystore decoded."
          else
            echo "KEYSTORE_BASE64 secret is not set: the release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          MOUSE_POINTER_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          MOUSE_POINTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOUSE_POINTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare artifact
        id: meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' buildSrc/src/main/kotlin/Configs.kt)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' buildSrc/src/main/kotlin/Configs.kt)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "mouse-pointer-v${VERSION_NAME}.apk"
          ls -l "mouse-pointer-v${VERSION_NAME}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouse-pointer-v${{ steps.meta.outputs.version_name }}
          path: mouse-pointer-v*.apk
          if-no-files-found: error

      - name: Publish versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mouse-pointer-v*.apk
          generate_release_notes: true
          make_latest: true

      - name: Publish/update latest build release (branch push)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build (自动构建)"
          body: |
            由 GitHub Actions 自动构建。

            - commit: `${{ github.sha }}`
            - versionName: `${{ steps.meta.outputs.version_name }}`
            - versionCode: `${{ steps.meta.outputs.version_code }}`
          files: mouse-pointer-v*.apk
          prerelease: true
          make_latest: false
